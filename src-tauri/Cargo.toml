[package]
name = "linotes"
version = "0.1.4"
description = "Local-first Markdown notes for Linux"
authors = ["Aral Alkan", "Linotes contributors"]
license = "MIT"
repository = "https://github.com/arlkn/linotes"
homepage = "https://github.com/arlkn/linotes"
edition = "2024"
rust-version = "1.90"
default-run = "linotes"

[lib]
name = "linotes_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2.8.0"
tauri-plugin-opener = "2.6.0"
tauri-plugin-single-instance = "2.5.0"
tauri-plugin-log = "2.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2.0"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1.26", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
pulldown-cmark = { version = "0.13", default-features = false }
notify = "8.2"
notify-debouncer-full = "0.7"
walkdir = "2.5"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.11"
dirs = "7.0"
yaml-rust2 = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
# Already used by Tauri's window layer; reads the desktop's light/dark preference.
dbus = "0.9"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
