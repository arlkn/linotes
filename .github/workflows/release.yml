name: Release

# Builds .deb, .rpm and AppImage packages for a version tag and attaches them
# to a draft GitHub release for review before publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux packages
    # The oldest supported Ubuntu keeps the AppImage compatible with more distributions (glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Linotes ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for the changes in this release.
          releaseDraft: true
          prerelease: false
