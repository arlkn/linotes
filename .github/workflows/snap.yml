name: Snap

# Packs the snap from the release's .deb (snap/snapcraft.yaml repackages it).
# When a release is published, the snap is uploaded to the Snap Store's stable
# channel; the store reviews each revision before it goes public.
#
# Running the workflow by hand either publishes an existing release (give its
# tag), or builds a .deb from the chosen branch and only attaches the snap to
# the run, for testing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to publish to the Snap Store (e.g. v0.1.1); leave empty to build a test snap
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deb:
    name: Build .deb for testing
    if: github.event_name == 'workflow_dispatch' && inputs.release == ''
    # Same environment as the release workflow.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config \
            libwebkit2gtk-4.1-dev libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run tauri build -- --bundles deb

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  snap:
    name: Build snap
    needs: deb
    if: ${{ !cancelled() && (needs.deb.result == 'success' || needs.deb.result == 'skipped') }}
    runs-on: ubuntu-24.04
    outputs:
      file: ${{ steps.pack.outputs.file }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the release's .deb
        if: github.event_name == 'release' || inputs.release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.release }}
        run: |
          mkdir -p src-tauri/target/release/bundle/deb
          cd src-tauri/target/release/bundle/deb
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern '*.deb' --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          rm SHA256SUMS

      - name: Download the test .deb
        if: github.event_name == 'workflow_dispatch' && inputs.release == ''
        uses: actions/download-artifact@v8
        with:
          name: deb
          path: src-tauri/target/release/bundle/deb

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      # The runner is a throwaway Ubuntu 24.04 VM, the same as the core24 base,
      # so the snap can be packed directly on it instead of in a container.
      - name: Pack
        id: pack
        run: |
          sudo snapcraft pack --destructive-mode
          echo "file=$(ls *.snap)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: snap
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

  publish:
    name: Publish to the Snap Store
    needs: snap
    # The skipped test .deb job would otherwise skip this job too.
    if: ${{ !cancelled() && needs.snap.result == 'success' && (github.event_name == 'release' || inputs.release != '') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: snap

      - name: Upload to the stable channel
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::warning::SNAPCRAFT_STORE_CREDENTIALS is not set; skipping the Snap Store upload."
            exit 0
          fi
          sudo snap install snapcraft --classic
          snapcraft upload --release=stable "${{ needs.snap.outputs.file }}"
