# Snap package recipe. Built and published by .github/workflows/snap.yml;
# see docs/DISTRIBUTION.md for building it locally.
name: linotes
title: Linotes
base: core24
adopt-info: linotes # the version comes from package.json
summary: Local-first Markdown notes
description: |
  Linotes is a fast, private notes app for Linux. Your notes are plain Markdown
  files in a folder you choose — no account, no cloud, no telemetry.

  - Rich text editing with checklists, code blocks and links, or plain Markdown
  - Folders, favorites, recently edited notes and a Trash with restore
  - Instant full-text search
  - Changes made by other apps and sync tools appear live
  - Import and export Markdown, or back up by copying a folder

  Notes are stored in ~/Documents/Linotes. To keep notes on an external drive, run:
  sudo snap connect linotes:removable-media
license: MIT
website: https://github.com/arlkn/linotes
source-code: https://github.com/arlkn/linotes
issues: https://github.com/arlkn/linotes/issues
contact: https://github.com/arlkn/linotes/issues
grade: stable
confinement: strict
icon: src-tauri/icons/icon.png

platforms:
  amd64:

apps:
  linotes:
    command: usr/bin/linotes
    desktop: usr/share/applications/Linotes.desktop
    common-id: io.github.arlkn.Linotes
    # The GNOME runtime provides GTK and WebKitGTK, so they are not bundled.
    extensions: [gnome]
    plugs:
      - home # ~/Documents/Linotes (Linotes uses $SNAP_REAL_HOME)
      - removable-media # notes folders on external drives
      - single-instance-plug
    slots:
      - single-instance

# A second launch hands over to the running window over D-Bus
# (tauri-plugin-single-instance registers "<identifier>.SingleInstance").
slots:
  single-instance:
    interface: dbus
    bus: session
    name: io.github.arlkn.Linotes.SingleInstance

plugs:
  single-instance-plug:
    interface: dbus
    bus: session
    name: io.github.arlkn.Linotes.SingleInstance

parts:
  linotes:
    plugin: dump
    source: .
    build-snaps:
      - node/22/stable
      - rustup/latest/stable
    build-packages:
      - build-essential
      - pkg-config
      - dpkg
      - libwebkit2gtk-4.1-dev
      - libdbus-1-dev
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)"
    override-build: |
      set -eu
      rustup default stable
      npm ci
      npm run tauri build -- --bundles deb
      dpkg -x src-tauri/target/release/bundle/deb/*.deb "$CRAFT_PART_INSTALL/"
      sed -i -e "s|^Icon=linotes$|Icon=/usr/share/icons/hicolor/512x512/apps/linotes.png|" \
        "$CRAFT_PART_INSTALL/usr/share/applications/Linotes.desktop"
